<div id="root"></div>

<script type="text/babel">
const { useEffect, useRef } = React;

try { mermaid.initialize({ startOnLoad:false, theme:'default', securityLevel:'loose', fontFamily:'Pretendard, sans-serif' }); } catch(e){}

// 라이브 Mermaid 렌더 (PNG 대신 코드에서 직접 그림 → 절대 깨지지 않음)
const Mermaid = ({chart, id}) => {
  const ref = useRef(null);
  useEffect(()=>{
    let alive = true;
    const draw = () => {
      if (typeof mermaid === 'undefined') { setTimeout(draw, 120); return; }
      mermaid.render('mm-'+id, chart)
        .then(({svg}) => { if (alive && ref.current) ref.current.innerHTML = svg; })
        .catch(() => { if (ref.current) ref.current.innerHTML = '<div class="text-xs text-slate-400">diagram</div>'; });
    };
    draw();
    return () => { alive = false; };
  }, [chart, id]);
  return <div ref={ref} className="mmd" />;
};

const SEQ = `sequenceDiagram
    actor Player
    participant UI as CraftingUI
    participant Mgr as CraftingManager
    participant Inv as Inventory
    Player->>UI: 제작 버튼 클릭(recipeId)
    UI->>Mgr: RequestCraft(recipeId)
    Mgr->>Inv: HasIngredients(recipe)
    Inv-->>Mgr: true
    Note over Mgr: 확률 판정 roll() < SuccessRate
    Mgr->>Inv: Consume(ingredients, 1.0)
    Mgr->>Inv: Add(result)
    Mgr-->>UI: OnCraftCompleted(성공)
    UI-->>Player: 성공 연출 표시`;

const CLS = `classDiagram
    class ICraftingService {
        <<interface>>
        +event OnCraftCompleted
        +RequestCraft(recipeId) void
    }
    class CraftingManager {
        -Inventory inventory
        +RequestCraft(recipeId) void
    }
    class Inventory {
        +HasIngredients(items) bool
        +Consume(items, ratio) void
        +Add(item) void
    }
    class CraftingUI {
        -ICraftingService crafting
    }
    ICraftingService <|.. CraftingManager : implements
    CraftingManager --> Inventory : uses
    CraftingUI ..> ICraftingService : depends on`;

// ══════════════ 문서 레이아웃 목업 (크래프팅 시스템 콘텐츠) ══════════════

// 1) 문서 헤더
const DocHeader = () => (
  <div className="doc">
    <div className="tag text-brand-600">Technical Documentation</div>
    <div className="dh1 mt-2">CraftingSystem — 아이템 크래프팅 시스템</div>
    <div className="dsub">Unity(C#) 생존 게임의 확률 기반 제작 시스템 설계·구현 기록</div>
    <hr/>
    <table className="meta"><tbody>
      <tr><td className="k">작성자</td><td>김재훈 (Jay)</td><td className="k" style={{paddingLeft:'32px'}}>기간</td><td>2025.06 ~ 07</td></tr>
      <tr><td className="k">엔진</td><td>Unity 2022.3 · C# 10</td><td className="k" style={{paddingLeft:'32px'}}>링크</td><td className="text-brand-600">GitHub · 시연 영상</td></tr>
    </tbody></table>
  </div>
);
// 2) 개요 섹션
const DocOverview = () => (
  <div className="doc">
    <div className="dh2"><span className="n">1.</span>개요</div>
    <p>본 문서는 재료를 소비해 아이템을 <b>확률적으로 제작</b>하는 크래프팅 시스템의 설계와 구현을 설명합니다.
      <span className="tagi"> (문제) </span> 기존에는 제작 로직이 UI 코드에 뒤섞여 있어, 새 레시피를 추가할 때마다
      UI를 수정해야 했고 확률·실패 처리를 테스트하기 어려웠습니다.</p>
    <p><span className="tagi">(해결) </span> 이를 해결하기 위해 제작 로직을 UI와 분리하고, 결과를 <b>이벤트</b>로 전파하는
      구조를 도입했습니다. 본 문서는 그 구조·핵심 코드·설계 판단을 다룹니다.</p>
    <table className="d"><tbody>
      <tr><th style={{width:'34%'}}>항목</th><th>내용</th></tr>
      <tr><td>핵심 규칙</td><td>확률 성공 · 실패 시 재료 50% 소비 · 이벤트로 결과 전파</td></tr>
      <tr><td>예시 레시피</td><td>나무 ×3 + 돌 ×2 → 돌도끼 ×1 (successRate 0.8)</td></tr>
      <tr><td>네임스페이스</td><td className="mono">Game.Crafting</td></tr>
    </tbody></table>
  </div>
);
// 3) 본문 + 다이어그램 + 캡션 ★
const DocDiagram = () => (
  <div className="doc">
    <div className="dh2"><span className="n">2.</span>시스템 구조 — 핵심 동작 흐름</div>
    <p>제작 요청은 <b>UI → Manager → Inventory</b> 순으로 흐릅니다. 아래 시퀀스는 '성공' 케이스에서
      각 객체가 주고받는 메시지의 순서입니다.</p>
    <figure>
      <Mermaid id="seq" chart={SEQ} />
      <figcaption>그림 1. 제작 성공 시퀀스 — 결과는 이벤트(점선)로 UI에 전달된다</figcaption>
    </figure>
    <p>여기서 핵심은 <b>CraftingManager가 CraftingUI를 직접 호출하지 않는다</b>는 점입니다. 결과는
      <span className="mono"> OnCraftCompleted</span> 이벤트로 전파되어 UI·사운드·통계가 각자 구독합니다.
      덕분에 결과를 쓸 대상이 늘어도 Manager 코드는 변하지 않습니다. (느슨한 결합)</p>
  </div>
);
// 4) 코드 + 설명 ★
const DocCode = () => (
  <div className="doc">
    <div className="dh2"><span className="n">3.</span>핵심 기능 — RequestCraft</div>
    <p>이 기능을 외부(<span className="mono">CraftingUI</span>)에서 쓰려면 <b>RequestCraft(recipeId)</b> 한
      함수만 알면 됩니다. 내부 동작의 심장부는 다음과 같습니다.</p>
    <pre>{`public void RequestCraft(string recipeId)
{
    var recipe = FindRecipe(recipeId);
    if (recipe == null) { Publish(Fail); return; }

    `}<span className="c">{`// (Why) 소비 전 검증 → 재료 유실 방지`}</span>{`
    if (!inventory.HasIngredients(recipe.Ingredients))
    { Publish(Fail); return; }

    var success = roll() < recipe.SuccessRate;   `}<span className="c">{`// 주입 → 테스트 가능`}</span>{`
    inventory.Consume(recipe.Ingredients, success ? 1f : .5f);
    if (success) inventory.Add(recipe.Result);

    Publish(success ? Success : Fail);           `}<span className="c">{`// 이벤트 발행`}</span>{`
}`}</pre>
    <div className="dh3">왜 이렇게 구현했나</div>
    <ul className="why">
      <li><b>소비 전 검증</b> — 재료를 쓰기 전에 먼저 확인해, 실패해도 유실이 없습니다.</li>
      <li><b>roll 주입</b> — 확률 판정을 외부에서 주입해 결정론적 단위 테스트가 가능합니다.</li>
      <li><b>소비율 분기</b> — 성공 100% / 실패 50%로 '실패 페널티' 규칙을 코드로 표현합니다.</li>
    </ul>
  </div>
);
// 5) 비교 표 + 결정 ★
const DocCompare = () => (
  <div className="doc">
    <div className="dh2"><span className="n">4.</span>고민과 선택 — 결과 전파 방식</div>
    <p>제작 결과를 UI에 전달하는 방법으로 두 가지를 검토했습니다.</p>
    <table className="d"><tbody>
      <tr><th style={{width:'22%'}}>방식</th><th>장점</th><th>단점</th></tr>
      <tr><td><b>[A] 직접 참조</b></td><td>직관적, 흐름 추적이 쉬움</td><td>강한 결합 — 대상이 늘면 Manager 수정</td></tr>

    </tbody></table>
    <p><span className="tagi">(결정) </span> <b>이벤트 방식(B)</b>을 택했습니다. 결과를 쓸 대상(UI·사운드·통계)이

);

const PromptBox = ({prompt}) => {
  const [copied, setCopied] = React.useState(false);
  const copy = () => {
    const done = () => { setCopied(true); setTimeout(()=>setCopied(false), 1500); };
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = prompt;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) {}
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).then(done).catch(fallback);
    } else { fallback(); }
  };
  return (
    <div className="pbox">
      <div className="ph">
        <span className="lbl">💬 이 패턴 만들기 — 예시 프롬프트 ([대괄호]만 내 것으로 교체)</span>
        <button onClick={copy}>{copied ? '복사됨 ✓' : '복사'}</button>
      </div>
      <div className="pb">{prompt}</div>
    </div>
  );
};
