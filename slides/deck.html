<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>유니티 개발자 취업·기술 문서 작성 가이드 v2 · 발표 덱</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --ink:#20233A; --muted:#71768F; --faint:#9AA0B8;
    --line:#E7E9F4; --paper:#FFFFFF; --bg:#EEF0F8;
    --indigo:#5B6AD0; --indigo-deep:#3E4CAB; --indigo-mid:#8B95E4;
    --indigo-soft:#EDEFFB; --indigo-chip:#E0E4FA;
    --code-bg:#1E2138; --code-fg:#E6E8F5; --code-dim:#8890BE;
    --ok:#2FA36B; --amber:#CC8207;
    --sans:'Pretendard','Noto Sans KR',-apple-system,sans-serif;
    --mono:'JetBrains Mono','D2Coding',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:var(--sans);}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  .mono{font-family:var(--mono);}

  /* ── Stage: 1280×720 무대를 뷰포트에 맞춰 스케일 ── */
  .stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .stage{width:1280px;height:720px;transform-origin:center center;flex:0 0 auto;}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--paper);
         box-shadow:0 24px 60px -24px rgba(30,33,58,.35);}

  /* ── 공통 헤더(내용 슬라이드) ── */
  .head{display:flex;align-items:baseline;justify-content:space-between;
        border-bottom:1px solid var(--line);padding-bottom:14px;}
  .eyebrow{font-size:15px;font-weight:800;color:var(--indigo);letter-spacing:.14em;text-transform:uppercase;}
  .head .rlabel{font-size:15px;color:var(--faint);font-weight:600;}
  .bignum{font-size:120px;font-weight:800;line-height:.9;color:var(--indigo-chip);letter-spacing:-.03em;}
  .title-xl{font-size:52px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.08;}
  .title-lg{font-size:40px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.1;}
  .subhead{font-size:22px;font-weight:700;color:var(--indigo);}

  /* ── 모티프 ── */
  .pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);
        border-radius:999px;padding:7px 18px;font-size:16px;font-weight:700;color:var(--ink);}
  .banner{display:inline-block;background:var(--indigo);color:#fff;border-radius:10px;
          padding:8px 18px;font-size:17px;font-weight:700;}
  .chip{display:inline-block;background:var(--indigo-soft);color:var(--indigo-deep);
        border-radius:7px;padding:2px 9px;font-weight:700;white-space:nowrap;}
  .dotrule{display:flex;align-items:center;}
  .dotrule .ln{height:2px;background:var(--indigo);flex:1;}
  .dotrule .dot{width:14px;height:14px;border-radius:50%;background:var(--indigo);margin-left:-2px;}
  .card{background:#FBFBFE;border:1px solid var(--line);border-radius:16px;}
  .labelchip{display:inline-flex;align-items:center;text-align:center;background:var(--code-bg);
             color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;line-height:1.35;}
  .arrow{color:var(--indigo);font-size:26px;font-weight:800;}

  /* ── 코드 블록 ── */
  .code{background:var(--code-bg);border-radius:12px;padding:20px 22px;color:var(--code-fg);
        font-family:var(--mono);font-size:15px;line-height:1.62;overflow:hidden;}
  .code .k{color:#C4A0FF;} .code .t{color:#7FE0C0;} .code .s{color:#F2B37D;} .code .c{color:var(--code-dim);}

  /* ── 복습용 컴포넌트 ── */
  /* 설명(Note): 소스 기반 맥락 상시 노출 */
  .note{background:#FAFBFF;border:1px solid var(--line);border-left:4px solid var(--indigo-mid);
        border-radius:0 12px 12px 0;padding:14px 18px;}
  .note .nlabel{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--indigo);text-transform:uppercase;}
  .note .nbody{margin-top:6px;font-size:16px;line-height:1.6;color:var(--muted);}
  .note b{color:var(--ink);}
  /* 인용/원칙 콜아웃 */
  .callout{background:var(--indigo-soft);border-radius:12px;padding:16px 22px;font-size:18px;color:var(--indigo-deep);line-height:1.6;}
  .callout b{color:var(--indigo-deep);font-weight:800;}
  /* 👎👍 비교 — 색 헤더 밴드 + 넓은 본문 */
  .goodbad{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  .gb{border-radius:12px;border:1px solid var(--line);overflow:hidden;}
  .gb.bad{background:#FDF7F6;border-color:#EFCBC6;}
  .gb.good{background:#F3FBF6;border-color:#C3E6D2;}
  .gb .gbh{font-size:15px;font-weight:800;color:#fff;padding:9px 16px;}
  .gb.bad .gbh{background:#CE6A5F;} .gb.good .gbh{background:#3BA776;}
  .gb .gbbody{padding:6px 16px 10px;}
  .gb .gbl{font-size:15.5px;line-height:1.58;color:var(--ink);padding:8px 0;word-break:keep-all;}
  .gb .gbl+.gbl{border-top:1px dashed rgba(0,0,0,.10);}
  .gb .gbl b{color:var(--indigo-deep);}
  /* 컴팩트 표 */
  table.mini{border-collapse:collapse;width:100%;font-size:15.5px;}
  table.mini th{background:var(--indigo);color:#fff;font-weight:700;text-align:left;padding:9px 14px;}
  table.mini td{padding:9px 14px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top;}
  table.mini tr:nth-child(even) td{background:#F7F8FD;}
  table.mini td b{color:var(--indigo-deep);}
  /* 체크리스트 */
  .checklist{display:flex;flex-direction:column;gap:10px;}
  .checklist .ci{display:flex;gap:12px;align-items:flex-start;font-size:16.5px;color:var(--ink);}
  .checklist .cb{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--indigo-soft);
                 color:var(--indigo-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .checklist .ci b{color:var(--indigo-deep);}
  /* 레퍼런스 카드 그리드 */
  .refcard{display:grid;gap:12px;}
  .refcard .rc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#FBFBFE;}
  .refcard .rc .rch{font-size:15px;font-weight:800;color:var(--ink);}
  .refcard .rc .rcd{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.45;}
  .wire{border:1.5px solid var(--indigo-mid);border-radius:8px;background:#fff;height:64px;position:relative;overflow:hidden;}
  .wire i{position:absolute;background:var(--indigo-soft);border-radius:3px;display:block;}
  /* 결정 트리 */
  .dtree{display:flex;flex-direction:column;gap:10px;}
  .dtree .q{background:var(--code-bg);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:16px;display:inline-block;}
  .dtree .branch{display:flex;align-items:center;gap:12px;padding-left:24px;}
  .dtree .ans{color:var(--indigo);font-weight:800;font-size:15px;min-width:150px;}
  /* 프롬프트 카드 */
  .pcard{background:#F7F8FD;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .pcard .ph{background:var(--indigo);color:#fff;font-size:13px;font-weight:800;padding:8px 14px;letter-spacing:.04em;}
  .pcard .pb{font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--ink);padding:12px 14px;white-space:pre-wrap;}
  .pcard .pb .ph-brk{color:var(--indigo-deep);font-weight:700;}
  /* 비유 박스 */
  .metaphor{background:#F5F6FE;border:1px dashed var(--indigo-mid);border-radius:12px;padding:14px 18px;}
  .metaphor .mh{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.02em;}
  .metaphor .mtag{display:inline-block;background:var(--indigo);color:#fff;font-size:11px;font-weight:800;
                  border-radius:5px;padding:2px 7px;margin-right:6px;vertical-align:1px;}
  .metaphor .mb{margin-top:7px;font-size:15px;color:var(--ink);line-height:1.58;}
  .metaphor .mb b{color:var(--indigo-deep);}
  /* 개념 서술 문단 */
  .note .nbody,.callout,.metaphor .mb,.concept,.gb .gbl,li{word-break:keep-all;}
  .concept{font-size:16px;line-height:1.62;color:var(--ink);}
  .concept b{color:var(--indigo-deep);}
  .concept .lead{color:var(--muted);}
  .kv{display:flex;gap:10px;margin-top:10px;}
  .kv .k{flex:0 0 auto;width:74px;font-weight:800;color:var(--indigo);font-size:15px;}
  .kv .v{font-size:15px;color:var(--ink);line-height:1.5;}

  ul{list-style:none;} li{position:relative;padding-left:18px;}
  li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--indigo-mid);}
  li.sub{padding-left:16px;color:var(--muted);font-size:.92em;}
  li.sub::before{background:none;content:'–';left:0;top:0;color:var(--faint);}

  /* ── HUD ── */
  .hud{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;
       gap:16px;padding:0 22px;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);
       border-top:1px solid var(--line);z-index:10;}
  .hud button{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:30px;
              font-size:16px;color:var(--ink);cursor:pointer;line-height:1;}
  .hud button:hover{border-color:var(--indigo);color:var(--indigo);}
  .hud .count{font-size:14px;font-weight:700;color:var(--muted);min-width:64px;}
  .hud .secname{font-size:13px;color:var(--faint);font-weight:600;}
  .hud .prog{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .hud .prog>span{display:block;height:100%;background:var(--indigo);transition:width .2s;}
  .hud .hint{font-size:12px;color:var(--faint);}
  .hud button.mode{width:auto;padding:0 12px;font-size:13px;font-weight:700;}

  /* ── 복습본(인쇄) 모드 ── */
  body.printing{overflow:auto;}
  .booklet{display:flex;flex-direction:column;align-items:center;gap:20px;padding:60px 0 64px;zoom:.62;}
  .booklet .slide{box-shadow:0 10px 30px -16px rgba(30,33,58,.3);}
  .printbar{position:fixed;top:0;left:0;right:0;height:48px;z-index:20;display:flex;align-items:center;
            justify-content:center;gap:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
            border-bottom:1px solid var(--line);}
  .printbar button{border:1px solid var(--indigo);background:var(--indigo);color:#fff;border-radius:8px;
                   padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  .printbar a{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
              padding:8px 16px;font-size:14px;font-weight:700;text-decoration:none;}
  .printbar .ph{font-size:13px;color:var(--muted);}
  @media print{
    @page{size:1280px 720px;margin:0;}
    html,body{overflow:visible;background:#fff;}
    .hud,.printbar{display:none !important;}
    .booklet{gap:0;padding:0;zoom:1;}
    .booklet .slide{box-shadow:none;break-after:page;page-break-after:always;}
    .booklet .slide:last-child{break-after:auto;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;

/* ── C# 라이트 신택스 하이라이터 ── */
// 키워드·타입을 한 번의 패스로 치환 → 주입된 태그(class="…") 안의 단어가 재매칭되지 않도록.
const TOKENS = /\b(namespace|public|private|sealed|class|interface|void|var|event|return|if|else|null|readonly|new|this|true|false|get|set)\b|\b(Action|Func|IReadOnlyList|Recipe|Inventory|Item|ItemStack|CraftingResult|CraftingManager|ICraftingService|float|string|bool|int)\b/g;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hlLine(line){
  const ci = line.indexOf('//');
  let codePart = ci>=0 ? line.slice(0,ci) : line;
  let comment = ci>=0 ? line.slice(ci) : '';
  let s = esc(codePart);
  // 문자열(한글 포함) 먼저 보호
  const strs=[]; s = s.replace(/"[^"]*"/g,m=>{strs.push(m);return `␀${strs.length-1}␀`;});
  s = s.replace(TOKENS,(m,k,t)=> k?`<span class="k">${k}</span>`:`<span class="t">${t}</span>`);
  s = s.replace(/␀(\d+)␀/g,(_,i)=>`<span class="s">${strs[+i]}</span>`);
  if(comment) s += `<span class="c">${esc(comment)}</span>`;
  return s;
}
const Code = ({children}) => (
  <div className="code">
    {children.replace(/^\n/,'').replace(/\n\s*$/,'').split('\n').map((ln,i)=>(
      <div key={i} dangerouslySetInnerHTML={{__html: hlLine(ln)||'&nbsp;'}} />
    ))}
  </div>
);

/* ── 공통 조각 ── */
const Head = ({eyebrow,rlabel}) => (
  <div className="head">
    <span className="eyebrow">{eyebrow}</span>
    {rlabel && <span className="rlabel">{rlabel}</span>}
  </div>
);
const DotRule = ({style}) => (
  <div className="dotrule" style={style}><span className="ln"/><span className="dot"/></div>
);

/* ── 복습용 컴포넌트 ── */
// 설명 블록: 소스 기반 맥락. children은 JSX(<b> 강조 포함).
const Note = ({label='설명', children, style}) => (
  <div className="note" style={style}>
    <div className="nlabel">{label}</div>
    <div className="nbody">{children}</div>
  </div>
);
const Callout = ({children, style}) => (
  <div className="callout" style={style}>{children}</div>
);
// 👎👍 비교: bad/good 각각 문자열 배열
const GoodBad = ({bad, good, badTitle='👎 아쉬운 예', goodTitle='👍 좋은 예', style}) => (
  <div className="goodbad" style={style}>
    <div className="gb bad">
      <div className="gbh">{badTitle}</div>
      <div className="gbbody">{bad.map((x,i)=><div key={i} className="gbl" dangerouslySetInnerHTML={{__html:x}}/>)}</div>
    </div>
    <div className="gb good">
      <div className="gbh">{goodTitle}</div>
      <div className="gbbody">{good.map((x,i)=><div key={i} className="gbl" dangerouslySetInnerHTML={{__html:x}}/>)}</div>
    </div>
  </div>
);
// 컴팩트 표: head=[], rows=[[...]]
const MiniTable = ({head, rows, style}) => (
  <table className="mini" style={style}>
    <thead><tr>{head.map((h,i)=><th key={i}>{h}</th>)}</tr></thead>
    <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} dangerouslySetInnerHTML={{__html:c}}/>)}</tr>)}</tbody>
  </table>
);
// 체크리스트: items 문자열 배열
const Checklist = ({items, style}) => (
  <div className="checklist" style={style}>
    {items.map((x,i)=>(
      <div key={i} className="ci"><span className="cb">✓</span>
        <span dangerouslySetInnerHTML={{__html:x}}/></div>
    ))}
  </div>
);
// 프롬프트 카드
const PromptCard = ({title, body, style}) => (
  <div className="pcard" style={style}>
    <div className="ph">{title}</div>
    <div className="pb">{body}</div>
  </div>
);
// 비유 박스
const MetaphorBox = ({title='비유', children, style}) => (
  <div className="metaphor" style={style}>
    <div className="mh"><span className="mtag">비유</span> {title}</div>
    <div className="mb">{children}</div>
  </div>
);
// 밀도 높은 개념 슬라이드: (상) 개념 | 비유  →  (하) 전폭 👎👍  →  팁
const ConceptSlide = ({eyebrow, rlabel, title, pill, concept, metaphor, bad, good, badTitle, goodTitle, tip, tipLabel='팁'}) => (
  <div className="slide" style={{padding:'34px 56px',display:'flex',flexDirection:'column'}}>
    <Head eyebrow={eyebrow} rlabel={rlabel}/>
    <div style={{display:'flex',alignItems:'center',gap:14,marginTop:12}}>
      <div className="title-lg" style={{fontSize:29}}>{title}</div>
      {pill && <span className="pill">{pill}</span>}
    </div>
    <div style={{display:'flex',gap:24,marginTop:14,alignItems:'stretch'}}>
      <div className="concept" style={{flex:1.3,minWidth:0}}>{concept}</div>
      {metaphor && <div style={{flex:1,minWidth:0,display:'flex'}}><MetaphorBox title={metaphor.title} style={{width:'100%'}}>{metaphor.body}</MetaphorBox></div>}
    </div>
    <div style={{marginTop:16,display:'flex',flexDirection:'column',justifyContent:'center',flex:1,minHeight:0}}>
      <GoodBad bad={bad} good={good} badTitle={badTitle} goodTitle={goodTitle}/>
    </div>
    {tip && <Note label={tipLabel}>{tip}</Note>}
  </div>
);

/* ═══════════════ 슬라이드 ═══════════════ */

// 00 표지 (에디토리얼 미니멀)
const Cover = () => (
  <div className="slide" style={{padding:'70px 84px',display:'flex',flexDirection:'column'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                 borderBottom:'1px solid var(--line)',paddingBottom:'16px'}}>
      <span className="eyebrow">Unity Developer · Career &amp; Tech-Doc Guide</span>
      <span style={{color:'var(--faint)',fontWeight:700}}>v2 · 2026</span>
    </div>
    <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center'}}>
      <div style={{fontSize:64,fontWeight:800,lineHeight:1.14,letterSpacing:'-.03em',color:'var(--ink)'}}>
        무엇을 쓸지에 더해,<br/>
        <span style={{color:'var(--indigo)'}}>어떻게 보여줄지</span>까지.
      </div>
      <div style={{marginTop:24,fontSize:24,color:'var(--muted)',fontWeight:600}}>
        유니티 개발자를 위한 취업·기술 문서 작성 가이드
      </div>
    </div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
      <div>
        <div style={{fontSize:14,fontWeight:800,letterSpacing:'.12em',color:'var(--faint)'}}>GUIDE BY</div>
        <div style={{fontSize:30,fontWeight:800,color:'var(--ink)',marginTop:4}}>김재훈 <span style={{color:'var(--indigo)'}}>Jay · KooHoo</span></div>
      </div>
      <table style={{fontSize:15,borderCollapse:'collapse'}}>
        <tbody>
          {[['SUBJECT','문서 · 레이아웃 · 다이어그램 · AI'],['STACK','Markdown · Mermaid · React'],['EXAMPLE','Crafting System']].map(([k,v])=>(
            <tr key={k}>
              <td style={{color:'var(--faint)',fontWeight:800,letterSpacing:'.08em',padding:'5px 24px 5px 0'}}>{k}</td>
              <td style={{color:'var(--ink)',fontWeight:600,borderLeft:'2px solid var(--indigo)',paddingLeft:16}}>{v}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  </div>
);

// 01 목차
const Contents = () => {
  const items=[['1','취업 문서','이력서·자소서·포트폴리오'],['2','기술 문서','개요→구조→기능→선택→회고'],
    ['3','레이아웃','정보를 잘 전달하는 화면'],['4','Mermaid','코드로 그리는 다이어그램'],
    ['5','AI 워크플로우','챗봇으로 문서 가속'],['6','프롬프트','복사해 쓰는 한글 프롬프트']];
  return (
    <div className="slide" style={{padding:'64px 84px',display:'flex',flexDirection:'column'}}>
      <div style={{fontSize:60,fontWeight:800,color:'var(--ink)',letterSpacing:'-.02em'}}>CONTENTS</div>
      <DotRule style={{margin:'20px 0 40px'}}/>
      <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1fr',gap:'22px 56px',alignContent:'center'}}>
        {items.map(([n,t,d])=>(
          <div key={n} style={{display:'flex',alignItems:'center',gap:20,borderBottom:'1px solid var(--line)',paddingBottom:16}}>
            <div style={{width:44,height:44,borderRadius:12,background:'var(--indigo-soft)',color:'var(--indigo-deep)',

  {c:Closing, sec:'마무리'},
];

/* ── 무대 스케일 ── */
function useScale(){
  const [s,setS]=useState(1);
  useEffect(()=>{
    const fit=()=>setS(Math.min(window.innerWidth/1280,(window.innerHeight-44)/720));
    fit(); window.addEventListener('resize',fit); return ()=>window.removeEventListener('resize',fit);
  },[]);
  return s;
}

// 복습본(인쇄) 모드: 전 슬라이드를 세로 스택으로 렌더
function Booklet(){
  return (
    <>
      <div className="printbar">
        <button onClick={()=>window.print()}>복습본 인쇄 / PDF 저장</button>
        <a href="#1">← 덱으로 돌아가기</a>
        <span className="ph">Ctrl+P → 대상을 'PDF로 저장'</span>
      </div>
      <div className="booklet">
        {SLIDES.map((s,k)=>{const C=s.c; return <C key={k}/>;})}
      </div>
    </>
  );
}

function Deck(){
  const n=SLIDES.length;
  const [i,setI]=useState(()=>{const h=parseInt(location.hash.slice(1),10); return (h>=1&&h<=n)?h-1:0;});
  const [printMode,setPrintMode]=useState(()=>location.hash.slice(1)==='print');
  const scale=useScale();
  const go=useCallback(d=>setI(v=>Math.max(0,Math.min(n-1,v+d))),[n]);
  useEffect(()=>{
    const hc=()=>{
      const h=location.hash.slice(1);
      if(h==='print'){setPrintMode(true);}
      else{setPrintMode(false); const num=parseInt(h,10); if(num>=1&&num<=n) setI(num-1);}
    };
    window.addEventListener('hashchange',hc); return ()=>window.removeEventListener('hashchange',hc);
  },[n]);
  useEffect(()=>{document.body.classList.toggle('printing',printMode);},[printMode]);
  useEffect(()=>{
    const k=e=>{
      if(printMode) return;
      if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(1);}
      else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
      else if(e.key==='Home')setI(0); else if(e.key==='End')setI(n-1);
    };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k);
  },[go,n,printMode]);
  useEffect(()=>{if(!printMode) location.hash=i+1;},[i,printMode]);

  if(printMode) return <Booklet/>;
  const S=SLIDES[i].c;
  return (
    <>
      <div className="stage-wrap" style={{bottom:44}}>
        <div className="stage" style={{transform:`scale(${scale})`}}><S/></div>
      </div>
      <div className="hud">
        <button onClick={()=>go(-1)} disabled={i===0}>‹</button>
        <button onClick={()=>go(1)} disabled={i===n-1}>›</button>
        <span className="count">{String(i+1).padStart(2,'0')} / {n}</span>
        <span className="secname">{SLIDES[i].sec}</span>
        <div className="prog"><span style={{width:`${(i+1)/n*100}%`}}/></div>
        <button className="mode" onClick={()=>{location.hash='print';}}>복습본</button>
        <span className="hint">← →</span>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Deck/>);
</script>
</body>
</html>
